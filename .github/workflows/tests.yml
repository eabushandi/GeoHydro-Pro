name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted Windows runners are Windows *Server* images:
        #   windows-2022 = Windows Server 2022 (build 20348, Windows 10 21H2-era kernel)
        #   windows-2025 = Windows Server 2025 (build 26100, same base as Windows 11 24H2)
        # They are evidence for, not proof of, Windows 10 / 11 desktop compatibility.
        os: [windows-2022, windows-2025, ubuntu-24.04]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Report operating system
        shell: pwsh
        run: |
          if ($IsWindows) {
            Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber, OSArchitecture
          } else { uname -a; cat /etc/os-release }
          python -c "import platform, sys; print(platform.platform(), sys.version)"

      - name: Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          pip list

      - name: Run test suite
        run: python -m pytest -v --junitxml=junit-${{ matrix.os }}-py${{ matrix.python }}.xml

      - name: Smoke test - CLI entry point
        run: geohydro-pro --version

      - name: Smoke test - drive the real application and capture screenshots
        run: python tools/make_screenshots.py screenshots-out

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            junit-*.xml
            screenshots-out/
          if-no-files-found: warn
